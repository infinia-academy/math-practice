<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176b87">
  <meta name="description" content="Infinia Math Practice — short bilingual arithmetic fluency practice for addition, subtraction, and times tables.">
  <title>Infinia Math Practice</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="stylesheet" href="./assets/braindrops.css?v=3">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css" integrity="sha384-3rdsX6e5mueWyoweR9NIVmtEsUkokpBT/0ALqKKIBMr9j4qhHkaIkAcGgsE6uVlp" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js" integrity="sha384-QFFtAGzvvj+bfgCGxXJlNZZR1nXEZgvG8tDLCCY1F19xl20WlfTYgguB4VcNdxYk" crossorigin="anonymous"></script>
  <script defer src="./assets/braindrops.js?v=3"></script>
  <script defer src="./assets/app.js?v=3"></script>

<body>
  <a class="skip-link" href="#main">Skip to practice</a>
  <div id="app-shell">
    <header class="site-header">
      <button id="brand-home" class="brand" type="button" aria-label="Go to home">
        <span class="brand-mark" aria-hidden="true">∞</span>
        <span class="brand-copy">
          <span class="brand-kicker">INFINIA ACADEMY</span>
          <span class="brand-title">Math Practice</span>
        </span>
      </button>
      <div class="header-actions">
        <div class="lang-switch" role="group" aria-label="Language display">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="both" class="active">EN/ไทย</button>
          <button type="button" data-lang="th">ไทย</button>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div id="view" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
      <span>Infinia Academy · Accuracy first, then speed.</span>
      <span id="app-version"></span>
    </footer>
  </div>
  <noscript>This practice app requires JavaScript. / แบบฝึกนี้ต้องเปิดใช้งาน JavaScript</noscript>
